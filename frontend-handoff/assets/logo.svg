<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="PyroLens">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb27a"/>
      <stop offset="1" stop-color="#ff7a33"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb27a"/>
      <stop offset="0.55" stop-color="#ff7a33"/>
      <stop offset="1" stop-color="#ff7a33" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- objectif : anneau de la lentille -->
  <circle cx="48" cy="48" r="38" fill="none" stroke="url(#ember)" stroke-width="4"/>
  <circle cx="48" cy="48" r="30" fill="none" stroke="#35c8c0" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.8"/>

  <!-- cœur incandescent -->
  <circle cx="48" cy="48" r="16" fill="url(#core)"/>

  <!-- ligne de balayage (scan) -->
  <path d="M14 48 H34 L40 38 L48 58 L55 44 L60 48 H82"
        fill="none" stroke="#dce6f2" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- graduations de l'objectif -->
  <g stroke="url(#ember)" stroke-width="3" stroke-linecap="round">
    <line x1="48" y1="4" x2="48" y2="12"/>
    <line x1="48" y1="84" x2="48" y2="92"/>
    <line x1="4" y1="48" x2="12" y2="48"/>
    <line x1="84" y1="48" x2="92" y2="48"/>
  </g>
</svg>
